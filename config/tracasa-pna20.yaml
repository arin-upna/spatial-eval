dataset:
  name: "Tracasa-PNA20"
  source_format: ".laz"

classes:
  names:
    2: "Ground"
    3: "Low vegetation"
    5: "Medium/high vegetation"
    6: "Building"
    17: "Vehicle"

  # Class-specific thresholds tau_c (m), as reported in the paper.
  distance_limits:
    2: 2
    3: 2
    5: 5
    6: 10
    17: 5

  grouping: {}
  ignore_in_metrics: []

evaluation:
  match_by_name_only: true
  dpi: 300
